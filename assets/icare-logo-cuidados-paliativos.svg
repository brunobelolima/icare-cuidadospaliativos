<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 283 284" role="img" aria-labelledby="title desc">
  <title id="title">iCare Abordagem Paliativa</title>
  <desc id="desc">Logotipo iCare em azul com a inscrição ABORDAGEM PALIATIVA</desc>
  <defs>
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#225f8f" flood-opacity=".35" />
    </filter>
  </defs>
  <rect width="283" height="284" fill="#5b91c2" />
  <g fill="#ffffff" text-anchor="middle" filter="url(#text-shadow)">
    <text x="141.5" y="141" font-family="Inter, Arial, Helvetica, sans-serif" font-size="86" font-weight="300" letter-spacing="-2">iCare</text>
    <text x="141.5" y="195" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing=".2">Abordagem Paliativa</text>
  </g>
</svg>
