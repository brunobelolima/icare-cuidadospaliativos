  <rect x="6" y="6" width="148" height="148" rx="14" fill="none" stroke="#ffffff" stroke-width="3" opacity=".78" />
  <circle cx="118" cy="38" r="42" fill="#ffffff" opacity=".12" />
  <circle cx="38" cy="127" r="50" fill="#ffffff" opacity=".08" />

